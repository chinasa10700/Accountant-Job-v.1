<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกงานที่ทำ-กลุ่มงานบัญชี</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        brand: {
                            primary: '#E6634C',   /* สีหลัก */
                            secondary: '#E9F0B7', /* สีรอง */
                            bg: '#245C94'         /* สีพื้นหลัง */
                        }
                    },
                    boxShadow: {
                        'playful': '6px 6px 0px 0px rgba(0, 0, 0, 0.2)'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #245C94; font-family: 'Prompt', sans-serif; }
        .step-content { display: none; }
        .step-content.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom styling for inputs to look playful */
        input[type="date"], input[type="text"], select, input[type="file"] {
            border: 2px solid #cbd5e1;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            width: 100%;
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #E6634C;
            box-shadow: 0 0 0 3px rgba(230, 99, 76, 0.2);
        }
        .btn {
            transition: all 0.2s;
        }
        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px rgba(0, 0, 0, 0.2) !important;
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">
    
    <div class="max-w-2xl w-full bg-[#E9F0B7] rounded-3xl shadow-playful p-6 md:p-10 relative overflow-hidden">
        <!-- Decorative shapes -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-brand-primary rounded-full opacity-20"></div>
        <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-brand-bg rounded-full opacity-10"></div>

        <div class="text-center mb-8 relative z-10">
            <h1 class="text-3xl md:text-4xl font-bold text-brand-bg mb-2">
                <i class="fas fa-clipboard-list mr-2 text-brand-primary"></i>บันทึกงานที่ทำ
            </h1>
            <p class="text-gray-700">กลุ่มงานบัญชี</p>
        </div>

        <!-- Progress Bar -->
        <div class="mb-8 relative z-10">
            <div class="flex justify-between mb-2">
                <span class="text-xs font-semibold inline-block text-brand-primary">ขั้นตอนที่ <span id="stepIndicator">1</span>/3</span>
            </div>
            <div class="flex h-2 mb-4 overflow-hidden bg-white rounded-full border border-gray-200">
                <div id="progressBar" class="flex flex-col justify-center bg-brand-primary transition-all duration-500 w-1/3"></div>
            </div>
        </div>

        <form id="appForm" onsubmit="event.preventDefault(); submitForm();" class="relative z-10">
            
            <div id="step1" class="step-content active">
                <h2 class="text-xl font-bold mb-4 text-brand-bg border-b-2 border-brand-primary pb-2 inline-block">1. ข้อมูลทั่วไป & ต้นทาง</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">วันที่ปัจจุบัน <span class="text-red-500">*</span></label>
                        <input type="date" id="currentDate" name="currentDate" required>
                        <p class="text-xs text-gray-500 mt-1">* บันทึกย้อนหลังได้ 1 วัน</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">เจ้าหน้าที่ <span class="text-red-500">*</span></label>
                        <select id="staffName" name="staffName" required>
                            <option value="">-- เลือกชื่อ --</option>
                            <option value="ธมกร">ธมกร</option>
                            <option value="วชิราภรณ์">วชิราภรณ์</option>
                            <option value="สมพร">สมพร</option>
                            <option value="ชยาภัสร์">ชยาภัสร์</option>
                            <option value="มนทนา">มนทนา</option>
                            <option value="สุรีย์พรรณ">สุรีย์พรรณ</option>
                            <option value="อัศวิน">อัศวิน</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">วันที่รับรายงานจากต้นทาง <span class="text-red-500">*</span></label>
                        <input type="date" id="receiveDate" name="receiveDate" required>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">รายงานข้อมูลเริ่มวันที่ <span class="text-red-500">*</span></label>
                            <input type="date" id="reportStartDate" name="reportStartDate" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">รายงานข้อมูลถึงวันที่ <span class="text-red-500">*</span></label>
                            <input type="date" id="reportEndDate" name="reportEndDate" required>
                        </div>
                    </div>
                </div>
            </div>

            <div id="step2" class="step-content">
                <h2 class="text-xl font-bold mb-4 text-brand-bg border-b-2 border-brand-primary pb-2 inline-block">2. ระยะเวลาการทำ GL & GF</h2>
                
                <div class="bg-white/50 p-4 rounded-xl border border-white mb-4">
                    <h3 class="font-semibold text-brand-primary mb-3"><i class="fas fa-book-open mr-2"></i>ส่วนของ GL</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ทำแล้ว GL เริ่มวันที่ <span class="text-red-500">*</span></label>
                            <input type="date" id="glStartDate" name="glStartDate" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ทำแล้ว GL ถึงวันที่ <span class="text-red-500">*</span></label>
                            <input type="date" id="glEndDate" name="glEndDate" required>
                        </div>
                    </div>
                </div>

                <div class="bg-white/50 p-4 rounded-xl border border-white">
                    <h3 class="font-semibold text-brand-primary mb-3"><i class="fas fa-laptop-code mr-2"></i>ส่วนของ GF</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ทำแล้ว GF เริ่มวันที่</label>
                            <input type="date" id="gfStartDate" name="gfStartDate">
                            <p class="text-xs text-red-500 mt-1">* ถ้าไม่ทำให้หมายเหตุท้ายรายการ</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ทำแล้ว GF ถึงวันที่</label>
                            <input type="date" id="gfEndDate" name="gfEndDate">
                            <p class="text-xs text-red-500 mt-1">* ถ้าไม่ทำให้หมายเหตุท้ายรายการ</p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="step3" class="step-content">
                <h2 class="text-xl font-bold mb-4 text-brand-bg border-b-2 border-brand-primary pb-2 inline-block">3. รายละเอียดงานที่ทำ</h2>
                
                <div class="space-y-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">สิ่งที่ทำ <span class="text-red-500">*</span></label>
                        <textarea id="taskDesc" name="taskDesc" rows="3" required class="w-full border-2 border-gray-300 rounded-xl p-3 focus:outline-none focus:border-brand-primary transition" placeholder="อธิบายรายละเอียดงานที่ได้ทำ... (หากไม่ได้ทำส่วน GF ให้ระบุหมายเหตุที่นี่)"></textarea>
                    </div>
                    
                    <div class="bg-white p-4 rounded-xl border border-dashed border-gray-400">
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-cloud-upload-alt text-brand-primary mr-2"></i>แนบไฟล์ประกอบ (ถ้ามี)
                        </label>
                        <input type="file" id="fileUpload" class="text-sm">
                        <p class="text-xs text-gray-500 mt-1">ไฟล์จะถูกอัปโหลดไปยัง Google Drive</p>
                    </div>
                </div>

                <!-- Summary Section (Hidden by default, shown before submit) -->
                <div id="summarySection" class="hidden bg-brand-bg text-white p-4 rounded-xl mb-4 text-sm">
                    <h3 class="font-bold text-brand-secondary mb-2 border-b border-white/20 pb-1">สรุปข้อมูลเตรียมบันทึก</h3>
                    <div id="summaryContent" class="space-y-1 opacity-90"></div>
                </div>
            </div>

            <div class="flex justify-between mt-8">
                <button type="button" id="prevBtn" onclick="nextPrev(-1)" class="hidden btn px-6 py-2 bg-gray-400 text-white rounded-full font-semibold shadow-playful hover:bg-gray-500">
                    <i class="fas fa-chevron-left mr-2"></i> ย้อนกลับ
                </button>
                <div class="flex-grow"></div>
                <button type="button" id="nextBtn" onclick="nextPrev(1)" class="btn px-8 py-2 bg-brand-bg text-white rounded-full font-semibold shadow-playful hover:bg-blue-800">
                    ถัดไป <i class="fas fa-chevron-right ml-2"></i>
                </button>
                <button type="submit" id="submitBtn" class="hidden btn px-8 py-2 bg-brand-primary text-white rounded-full font-semibold shadow-playful hover:bg-red-600">
                    <i class="fas fa-save mr-2"></i> บันทึกข้อมูล
                </button>
            </div>
        </form>
    </div>

    <script>
        let currentTab = 0;
        showTab(currentTab);
        setupDateConstraints();

        // จำกัดวันที่ปัจจุบัน ให้เลือกได้แค่วันนี้ และย้อนหลัง 1 วัน
        function setupDateConstraints() {
            const dateInput = document.getElementById('currentDate');
            const today = new Date();
            
            // วานนี้
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            
            // Format dates (YYYY-MM-DD)
            const formatDate = (date) => {
                // Adjust for local timezone
                const offset = date.getTimezoneOffset();
                date = new Date(date.getTime() - (offset*60*1000));
                return date.toISOString().split('T')[0];
            };

            dateInput.setAttribute('max', formatDate(today));
            dateInput.setAttribute('min', formatDate(yesterday));
            dateInput.value = formatDate(today); // Default to today
        }

        function showTab(n) {
            let x = document.getElementsByClassName("step-content");
            for (let i = 0; i < x.length; i++) {
                x[i].classList.remove("active");
            }
            x[n].classList.add("active");
            
            document.getElementById("stepIndicator").innerText = n + 1;
            document.getElementById("progressBar").style.width = ((n + 1) / x.length * 100) + "%";
            
            if (n == 0) {
                document.getElementById("prevBtn").classList.add("hidden");
            } else {
                document.getElementById("prevBtn").classList.remove("hidden");
            }
            
            if (n == (x.length - 1)) {
                document.getElementById("nextBtn").classList.add("hidden");
                document.getElementById("submitBtn").classList.remove("hidden");
                generateSummary();
            } else {
                document.getElementById("nextBtn").classList.remove("hidden");
                document.getElementById("submitBtn").classList.add("hidden");
                document.getElementById("summarySection").classList.add("hidden");
            }
        }

        function nextPrev(n) {
            let x = document.getElementsByClassName("step-content");
            if (n == 1 && !validateForm()) return false;
            
            currentTab = currentTab + n;
            if (currentTab >= x.length) {
                // Should not reach here because form handles submit
                return false;
            }
            showTab(currentTab);
        }

        function validateForm() {
            let x, y, i, valid = true;
            x = document.getElementsByClassName("step-content");
            y = x[currentTab].querySelectorAll("input[required], select[required], textarea[required]");
            
            for (i = 0; i < y.length; i++) {
                if (y[i].value == "") {
                    y[i].classList.add("border-red-500");
                    y[i].classList.add("bg-red-50");
                    valid = false;
                } else {
                    y[i].classList.remove("border-red-500");
                    y[i].classList.remove("bg-red-50");
                }
            }
            
            if(!valid) {
                Swal.fire({
                    icon: 'warning',
                    title: 'ข้อมูลไม่ครบ',
                    text: 'กรุณากรอกข้อมูลในช่องที่จำเป็น (*) ให้ครบถ้วน',
                    confirmButtonColor: '#E6634C'
                });
            }
            return valid;
        }

        function generateSummary() {
            const summaryDiv = document.getElementById("summarySection");
            const contentDiv = document.getElementById("summaryContent");
            
            // Format date for display
            const fDate = (val) => val ? val.split('-').reverse().join('/') : '-';

            const html = `
                <div class="grid grid-cols-2 gap-2">
                    <div><b>จนท:</b> ${document.getElementById("staffName").value}</div>
                    <div><b>วันที่บันทึก:</b> ${fDate(document.getElementById("currentDate").value)}</div>
                    <div class="col-span-2"><b>งานที่ทำ:</b> ${document.getElementById("taskDesc").value}</div>
                </div>
            `;
            contentDiv.innerHTML = html;
            summaryDiv.classList.remove("hidden");
        }

        async function submitForm() {
            if (!validateForm()) return;

            // Loading state
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> กำลังบันทึก...';
            btn.disabled = true;

            try {
                const formData = {
                    currentDate: document.getElementById('currentDate').value,
                    staffName: document.getElementById('staffName').value,
                    receiveDate: document.getElementById('receiveDate').value,
                    reportStartDate: document.getElementById('reportStartDate').value,
                    reportEndDate: document.getElementById('reportEndDate').value,
                    glStartDate: document.getElementById('glStartDate').value,
                    glEndDate: document.getElementById('glEndDate').value,
                    gfStartDate: document.getElementById('gfStartDate').value,
                    gfEndDate: document.getElementById('gfEndDate').value,
                    taskDesc: document.getElementById('taskDesc').value
                };

                const fileInput = document.getElementById('fileUpload');
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                const base64 = await getBase64(file);
                formData.fileData = base64.split(',')[1];
                formData.fileName = file.name;
                formData.fileMimeType = file.type;
            }

            // ตรวจสอบว่ามี google.script.run หรือไม่ ถ้าไม่มีให้จำลองการทำงานสำหรับการทดสอบ
            if (typeof google === 'undefined' || !google.script || !google.script.run) {
                console.warn('Google Apps Script environment not detected. Simulating form submission.');
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'สำเร็จ! (โหมดทดสอบ)',
                        text: 'จำลองการบันทึกข้อมูลเรียบร้อยแล้ว เนื่องจากไม่ได้รันบน Google Apps Script ข้อมูลจึงไม่ได้ถูกบันทึกจริง',
                        confirmButtonColor: '#245C94',
                        allowOutsideClick: false
                    }).then((result) => {
                        if (result.isConfirmed) {
                            document.getElementById('appForm').reset();
                            currentTab = 0;
                            showTab(currentTab);
                            setupDateConstraints();
                        }
                    });
                }, 1500); // หน่วงเวลา 1.5 วินาทีให้ดูเหมือนกำลังทำงาน
                
                return; // จบการทำงานฟังก์ชันที่นี่ในโหมดจำลอง
            }

            google.script.run
                .withSuccessHandler(function(response) {
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                        
                        if (response.success) {
                            Swal.fire({
                                icon: 'success',
                                title: 'สำเร็จ!',
                                text: response.message,
                                confirmButtonColor: '#245C94',
                                allowOutsideClick: false
                            }).then((result) => {
                                if (result.isConfirmed) {
                                    document.getElementById('appForm').reset();
                                    currentTab = 0;
                                    showTab(currentTab);
                                    setupDateConstraints();
                                }
                            });
                        } else {
                            Swal.fire({
                                icon: 'error',
                                title: 'ไม่สามารถบันทึกได้',
                                text: response.message,
                                confirmButtonColor: '#E6634C'
                            });
                        }
                    })
                    .withFailureHandler(function(error) {
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                        Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้: ' + error, 'error');
                    })
                    .processForm(formData);

            } catch (err) {
                btn.innerHTML = originalText;
                btn.disabled = false;
                Swal.fire('ข้อผิดพลาด', err.message, 'error');
            }
        }

        // Helper function for file conversion
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
